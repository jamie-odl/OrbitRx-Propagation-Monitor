name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py orbitrx
      - run: python -m pytest -q -rA --junitxml=pytest-${{ matrix.os }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.os }}
          path: pytest-${{ matrix.os }}.xml

  windows-screenshot:
    name: Rig wizard screenshot (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Try to create a virtual COM port pair (best-effort, may be unavailable)
        continue-on-error: true
        timeout-minutes: 3
        run: choco install com0com -y --no-progress
      - name: List serial ports
        shell: pwsh
        run: python -m serial.tools.list_ports -v > rig-wizard-ports.txt
        continue-on-error: true
      - name: Screenshot the real rig wizard (native Windows QPA, real port enumeration)
        shell: pwsh
        run: python tools/screenshot_rig_wizard.py screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-wizard-windows-screenshot
          path: |
            screenshots/rig-wizard.png
            screenshots/rig-wizard-fallback.png
            screenshots/rig-wizard-dropdown.png
            rig-wizard-ports.txt
          retention-days: 30
          if-no-files-found: warn

  build-windows:
    name: Windows build (unsigned)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Stamp commit SHA into About metadata (N4)
        shell: bash
        run: |
          python tools/stamp_commit.py "${GITHUB_SHA:0:7}"
          grep -E 'COMMIT_SHA = "' orbitrx/_build_meta.py
      - name: Build executable
        run: |
          pyinstaller OrbitRxMonitor.spec --noconfirm
          if (!(Test-Path dist\OrbitRxMonitor\OrbitRxMonitor.exe)) { throw "exe missing" }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          # VersionInfoVersion must be strictly numeric; $ver may carry a
          # pre-release suffix (e.g. 5.3.0-rc.1), so derive the
          # 4-part numeric version the same way the exe's own resource does.
          $verNumeric = python -c "from tools.make_version_info import version_tuple4; print('.'.join(str(n) for n in version_tuple4('$ver')))"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVer=$ver" "/DAppVerNumeric=$verNumeric" installer\OrbitRxMonitor.iss
          if (!(Test-Path dist\OrbitRxMonitor-Setup.exe)) { throw "installer missing" }
      - name: Checksums
        shell: pwsh
        run: Get-FileHash dist\OrbitRxMonitor\OrbitRxMonitor.exe, dist\OrbitRxMonitor-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File dist\SHA256SUMS.txt -Encoding ascii
      # No ship-set artifact is ever uploaded from this public repository's CI
      # (any signed-in GitHub user can download Actions artifacts). The onedir
      # build, the exe, the installer and any zip of them stay on the runner.
      # Only a text inventory of what was built goes into release-shots/
      # (screenshots and text), so QA can see the shipped file list and hashes
      # without the binaries being published.
      - name: Ship-set inventory (text only, binaries are not uploaded)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-shots | Out-Null
          $inv = 'release-shots\ship-set-inventory.txt'
          $root = (Resolve-Path dist\OrbitRxMonitor).Path
          "version=$((Get-Content VERSION).Trim()) commit=$env:GITHUB_SHA" | Out-File $inv -Encoding utf8
          Get-Content dist\SHA256SUMS.txt | Out-File $inv -Append -Encoding utf8
          Get-ChildItem -Path $root -Recurse -File | Sort-Object FullName | ForEach-Object {
            "{0}`t{1}" -f $_.FullName.Substring($root.Length + 1).Replace('\','/'), $_.Length
          } | Out-File $inv -Append -Encoding utf8
          # Record FileVersion/ProductName of the four OpenSSL DLLs (NOTICE)
          # so the shipped OpenSSL build is on record alongside the hashes.
          foreach ($name in 'libcrypto-3.dll', 'libssl-3.dll', 'libcrypto-3-x64.dll', 'libssl-3-x64.dll') {
            $dll = Get-ChildItem -Path $root -Recurse -Filter $name -File -ErrorAction SilentlyContinue | Select-Object -First 1
            $line = if ($dll) {
              $v = $dll.VersionInfo
              "$name FileVersion=$($v.FileVersion) ProductName=$($v.ProductName)"
            } else {
              "$name not found in ship set"
            }
            Write-Host $line
            $line | Out-File $inv -Append -Encoding utf8
          }
          Write-Host "Ship-set inventory: $((Get-Content $inv).Count) lines (not uploaded as binaries)"
      # F1 ship-set gate: fails the build if a banned Qt binary (Pdf, Virtual
      # Keyboard, Quick/Qml, OpenGL, WebEngine/WebChannel, ...) reached the
      # onedir, or if a Qt library this build must keep is missing. Only a
      # text list of the Qt DLLs actually shipped is written out; no binary
      # is uploaded by this step.
      - name: Ship-set gate (no unused Qt binaries, required Qt libraries present)
        shell: pwsh
        run: |
          python tools/ship_set.py --check dist\OrbitRxMonitor --write-qt-list release-shots\ship-set-qt.txt
          if ($LASTEXITCODE -ne 0) { throw "ship-set gate failed: banned Qt binary present or a required Qt library is missing" }
          Write-Host "SHIP-SET-GATE: PASS"
          Get-Content release-shots\ship-set-qt.txt
      # Distributable upload stays off while packaging/distribution_manifest.json
      # lists release_blockers. release.yml runs that gate and uploads nothing.
      # release-shots later in this job are screenshots and text, not the exe.
      - name: Self-capture the release exe at 100% and 150% scale (M3 evidence)
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\OrbitRxMonitor\OrbitRxMonitor.exe).Path
          New-Item -ItemType Directory -Force -Path release-shots\100, release-shots\150 | Out-Null

          function Show-CaptureDiagnostics([string]$CaptureDir) {
            foreach ($name in 'shutdown-stage.txt', 'finalise-stage.txt', 'faulthandler.txt') {
              $f = Join-Path $CaptureDir $name
              if (Test-Path $f) {
                Write-Host "--- $name ($CaptureDir) ---"
                Get-Content $f
              } else {
                Write-Host "--- $name ($CaptureDir) missing ---"
              }
            }
          }

          function Invoke-ReleaseCapture([string]$CaptureDir, [string]$ScaleFactor) {
            Remove-Item Env:ORBITRX_TEST_SIMULATED_RIG -ErrorAction SilentlyContinue
            Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
            $env:ORBITRX_CAPTURE_DIR = (Resolve-Path $CaptureDir).Path
            $env:ORBITRX_COMMIT_SHA = $env:GITHUB_SHA.Substring(0,7)
            if ($ScaleFactor) { $env:QT_SCALE_FACTOR = $ScaleFactor }
            $proc = Start-Process -FilePath $exe -PassThru
            # Touch .Handle so Windows PowerShell actually populates .ExitCode once the
            # process exits (pwsh 7 does not need this, but it is harmless there too).
            $null = $proc.Handle
            if (-not $proc.WaitForExit(120000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Show-CaptureDiagnostics $CaptureDir
              throw "OrbitRxMonitor.exe did not exit within 120s for $CaptureDir"
            }
            if ($proc.ExitCode -ne 0) {
              Show-CaptureDiagnostics $CaptureDir
              throw "OrbitRxMonitor.exe exited $($proc.ExitCode) for $CaptureDir"
            }
            Get-ChildItem $CaptureDir | Format-Table Name, Length
            if (-not (Test-Path (Join-Path $CaptureDir 'rig-wizard-release-ports.txt'))) { throw "No capture written for $CaptureDir (exit $($proc.ExitCode))" }
          }

          Invoke-ReleaseCapture "release-shots\100" $null
          Invoke-ReleaseCapture "release-shots\150" "1.5"
          # Negative control: the same release exe WITH the test-only switch must list the
          # simulated rig, proving the gate below can actually see one.
          New-Item -ItemType Directory -Force -Path release-shots\negative-control | Out-Null
          $env:ORBITRX_TEST_SIMULATED_RIG = "1"
          $env:ORBITRX_CAPTURE_DIR = (Resolve-Path release-shots\negative-control).Path
          $proc = Start-Process -FilePath $exe -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(120000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Show-CaptureDiagnostics "release-shots\negative-control"
            throw "negative control did not exit"
          }
          if ($proc.ExitCode -ne 0) {
            Show-CaptureDiagnostics "release-shots\negative-control"
            throw "negative control exited $($proc.ExitCode)"
          }
          Remove-Item Env:ORBITRX_TEST_SIMULATED_RIG -ErrorAction SilentlyContinue
          Remove-Item Env:ORBITRX_CAPTURE_DIR, Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
      - name: Fail if the simulated rig leaked into the release build
        shell: pwsh
        run: |
          foreach ($f in 'release-shots\100\rig-wizard-release-ports.txt', 'release-shots\150\rig-wizard-release-ports.txt', 'release-shots\negative-control\rig-wizard-release-ports.txt') {
            if (-not (Test-Path $f) -or ((Get-Content $f -Raw).Trim().Length -eq 0)) { throw "Port list $f is missing or empty" }
          }
          $neg = Get-Content release-shots\negative-control\rig-wizard-release-ports.txt -Raw
          Write-Host "Negative control (ORBITRX_TEST_SIMULATED_RIG=1) port list:"
          Write-Host $neg
          if ($neg -notmatch "Simulated") { throw "Negative control did not list the simulated rig, so the gate cannot be trusted" }
          Write-Host "NEGATIVE-CONTROL: PASS (gate detects 'Simulated' when the test switch is on)"
          $ports = Get-Content release-shots\100\rig-wizard-release-ports.txt, release-shots\150\rig-wizard-release-ports.txt -Raw
          Write-Host "Release exe port list (100% and 150%):"
          Write-Host $ports
          if ($ports -match "Simulated") {
            throw "Simulated rig port leaked into the release exe's port list"
          }
          Write-Host "SIMULATED-GATE: PASS (no 'Simulated' entry in the release exe port list)"
      - name: Check Settings and main window fit the screen at 150%
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Runner screen: $($b.Width)x$($b.Height)"
          foreach ($d in 'release-shots\100', 'release-shots\150') {
            $fit = Get-Content (Join-Path $d 'fit.txt') -Raw
            Write-Host "$d : $fit"
            if ($fit -notmatch 'save_visible=True') { throw "Save button not visible in $d" }
            if ($fit -notmatch 'settings_frame_on_screen=True' -or $fit -notmatch 'main_frame_on_screen=True') { throw "A window runs off the screen in $d" }
            if ($fit -notmatch 'main_hscroll=False') { throw "Main window shows a horizontal scrollbar in $d" }
            if ($fit -notmatch 'about_frame_on_screen=True' -or $fit -notmatch 'wizard_frame_on_screen=True') { throw "About or rig wizard runs off the screen in $d" }
          }
          Write-Host "FIT-GATE: PASS (Save visible; Settings, main window, About and rig wizard fully on screen; no main-window horizontal scrollbar)"
      - name: Publisher check (thevenom, never Obsidian Dynamics)
        shell: pwsh
        run: |
          foreach ($f in 'dist\OrbitRxMonitor\OrbitRxMonitor.exe', 'dist\OrbitRxMonitor-Setup.exe') {
            $v = (Get-Item $f).VersionInfo
            Write-Host "$f : CompanyName='$($v.CompanyName)' LegalCopyright='$($v.LegalCopyright)'"
            if ("$($v.CompanyName) $($v.LegalCopyright)" -match 'Obsidian') { throw "Obsidian Dynamics found in $f version info" }
            if ("$($v.CompanyName)".Trim() -ne 'thevenom') { throw "Unexpected CompanyName in $f" }
          }
          Write-Host "PUBLISHER-CHECK: PASS"
      - name: PE check (security directory 0/0, publisher strings)
        shell: pwsh
        run: |
          python tools/pe_check.py release-shots\installer-publisher.txt dist\OrbitRxMonitor\OrbitRxMonitor.exe dist\OrbitRxMonitor-Setup.exe
      - name: Units check (no "n/a <unit>" in rendered Stats text)
        shell: pwsh
        run: |
          foreach ($d in 'release-shots\100', 'release-shots\150') {
            $t = Get-Content (Join-Path $d 'stats.txt') -Raw
            if ([string]::IsNullOrWhiteSpace($t)) { throw "stats.txt is empty in $d" }
            if ($t -match 'n/a\s+(MHz|UTC|km/h|nT|km|deg)') { throw "Found 'n/a' followed by a unit in $d stats text" }
          }
          Write-Host "UNITS-CHECK: PASS (no 'n/a' followed by a unit)"
      - name: Scan the bundled PYZ for the simulated-rig gate
        shell: pwsh
        run: |
          python tools/scan_pyz.py dist\OrbitRxMonitor\OrbitRxMonitor.exe release-shots\pyz-scan.txt
      - name: Measure DX cluster field edges
        shell: pwsh
        run: |
          python tools/measure_field_edges.py release-shots\100\settings-dx-cluster.png release-shots\100\settings-dx-cluster-edges.txt
          python tools/measure_field_edges.py release-shots\150\settings-dx-cluster.png release-shots\150\settings-dx-cluster-edges.txt
          foreach ($f in 'release-shots\100\settings-dx-cluster-edges.txt', 'release-shots\150\settings-dx-cluster-edges.txt') {
            if (-not (Test-Path $f) -or ((Get-Content $f -Raw).Trim().Length -eq 0)) { throw "Edges file $f is empty" }
            Write-Host "$f :"; Get-Content $f
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-exe-captures
          path: release-shots/
          retention-days: 30
          if-no-files-found: warn
