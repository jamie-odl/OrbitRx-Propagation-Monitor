name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py orbitrx
      - run: python -m pytest -q -rA --junitxml=pytest-${{ matrix.os }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.os }}
          path: pytest-${{ matrix.os }}.xml
      # The local-build script is never executed by CI (it is for Jamie's own
      # PC), but a parse error in it should still fail CI, not surface only
      # when someone next tries to run it. PSScriptAnalyzer runs only if it is
      # already present on the runner image; this step never installs modules
      # from the network.
      - name: Parse-check tools/build_release_local.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $scripts = @("tools\build_release_local.ps1", "tools\build_release_local.helpers.ps1")
          foreach ($script in $scripts) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Host $_.ToString() }
              throw "$script has $($parseErrors.Count) parse error(s)"
            }
          }
          Write-Host "PS1-PARSE-CHECK: PASS"
          if (Get-Module -ListAvailable -Name PSScriptAnalyzer) {
            Import-Module PSScriptAnalyzer
            $findings = @(foreach ($s in $scripts) { Invoke-ScriptAnalyzer -Path $s -Severity Error })
            if ($findings) {
              $findings | Format-Table -AutoSize | Out-String | Write-Host
              throw "PSScriptAnalyzer found $($findings.Count) Error-severity issue(s)"
            }
            Write-Host "PSSCRIPTANALYZER: PASS"
          } else {
            Write-Host "PSScriptAnalyzer module is not installed on this runner; skipping (this step does not install modules from the network)."
          }

  windows-screenshot:
    name: Rig wizard screenshot (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Try to create a virtual COM port pair (best-effort, may be unavailable)
        continue-on-error: true
        timeout-minutes: 3
        run: choco install com0com -y --no-progress
      - name: List serial ports
        shell: pwsh
        run: python -m serial.tools.list_ports -v > rig-wizard-ports.txt
        continue-on-error: true
      - name: Screenshot the real rig wizard (native Windows QPA, real port enumeration)
        shell: pwsh
        run: python tools/screenshot_rig_wizard.py screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rig-wizard-windows-screenshot
          path: |
            screenshots/rig-wizard.png
            screenshots/rig-wizard-fallback.png
            screenshots/rig-wizard-dropdown.png
            rig-wizard-ports.txt
          retention-days: 30
          if-no-files-found: warn

  build-windows:
    name: Windows build (unsigned)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # P1/P3: the build interpreter is pinned to the exact CPython whose
      # OpenSSL pair (FileVersion + sha256) and LICENSE.txt are recorded in
      # packaging/distribution_manifest.json and third_party/python/.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
      # R2: install the build dependencies only from the committed,
      # fully hash-pinned lock file (no transitive resolution against the
      # live index at build time). --no-deps is safe only because the lock
      # already lists every transitive dependency; pip check then confirms
      # that closure is complete and consistent.
      - name: Install Windows build dependencies from the hash-pinned lock
        run: |
          python -m pip install --require-hashes --no-deps -r packaging\requirements-windows-build.lock.txt
          python -m pip check
          python -m pip freeze
      - name: Stamp commit SHA into About metadata (N4)
        shell: bash
        run: |
          python tools/stamp_commit.py "${GITHUB_SHA:0:7}"
          grep -E 'COMMIT_SHA = "' orbitrx/_build_meta.py
      - name: Build executable
        run: |
          pyinstaller OrbitRxMonitor.spec --noconfirm
          if (!(Test-Path dist\OrbitRxMonitor\OrbitRxMonitor.exe)) { throw "exe missing" }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          # VersionInfoVersion must be strictly numeric; $ver may carry a
          # pre-release suffix (e.g. 5.3.0-rc.1), so derive the
          # 4-part numeric version the same way the exe's own resource does.
          $verNumeric = python -c "from tools.make_version_info import version_tuple4; print('.'.join(str(n) for n in version_tuple4('$ver')))"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVer=$ver" "/DAppVerNumeric=$verNumeric" installer\OrbitRxMonitor.iss
          if (!(Test-Path dist\OrbitRxMonitor-Setup.exe)) { throw "installer missing" }
      - name: Checksums
        shell: pwsh
        run: |
          $files = @(
            "dist\OrbitRxMonitor\OrbitRxMonitor.exe",
            "dist\OrbitRxMonitor-Setup.exe"
          )
          $files | ForEach-Object {
            $item = Get-Item $_
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($item.Name)"
            Write-Host ("ARTIFACT {0}  {1} bytes  sha256={2}" -f $item.Name, $item.Length, $hash)
          } | Out-File dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt
      # The text inventory in release-shots/ is screenshots and text. The
      # release zip packed at the end of this job is the one distributable
      # this workflow uploads, and only as a CI artifact. It is not a GitHub
      # Release and it does not replace the public 5.1.0 download.
      - name: Ship-set inventory (text only, binaries are not uploaded)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-shots | Out-Null
          $inv = 'release-shots\ship-set-inventory.txt'
          $root = (Resolve-Path dist\OrbitRxMonitor).Path
          "version=$((Get-Content VERSION).Trim()) commit=$env:GITHUB_SHA" | Out-File $inv -Encoding utf8
          Get-Content dist\SHA256SUMS.txt | Out-File $inv -Append -Encoding utf8
          Get-Item dist\OrbitRxMonitor\OrbitRxMonitor.exe, dist\OrbitRxMonitor-Setup.exe | ForEach-Object {
            "size $($_.Name) $($_.Length)" | Out-File $inv -Append -Encoding utf8
          }
          Get-ChildItem -Path $root -Recurse -File | Sort-Object FullName | ForEach-Object {
            "{0}`t{1}" -f $_.FullName.Substring($root.Length + 1).Replace('\','/'), $_.Length
          } | Out-File $inv -Append -Encoding utf8
          # P1: record FileVersion, ProductName and sha256 of the shipped
          # OpenSSL DLLs (CPython's own pair only) in the text inventory. The
          # pin is enforced by the "OpenSSL pin" step below.
          $pin = (Get-Content packaging\distribution_manifest.json -Raw | ConvertFrom-Json).ship_set.openssl
          foreach ($name in $pin.dlls.PSObject.Properties.Name) {
            $dll = Get-ChildItem -Path $root -Recurse -Filter $name -File -ErrorAction SilentlyContinue | Select-Object -First 1
            $line = if ($dll) {
              $v = $dll.VersionInfo
              $h = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLower()
              "$name FileVersion=$($v.FileVersion) ProductName=$($v.ProductName) sha256=$h"
            } else {
              "$name not found in ship set"
            }
            Write-Host $line
            $line | Out-File $inv -Append -Encoding utf8
          }
          Write-Host "Ship-set inventory: $((Get-Content $inv).Count) lines (not uploaded as binaries)"
      # P1 (Risk 161d6e5 screen): fail, not log, if CPython's OpenSSL pair is
      # missing or its FileVersion/sha256 differs from the manifest pin, or if
      # any other OpenSSL DLL (e.g. the runner's libcrypto-3-x64/libssl-3-x64)
      # or Qt's qopensslbackend.dll reached the onedir. The ship-set gate
      # below enforces the same exact-set rule from tools/ship_set.py.
      - name: OpenSSL pin (CPython pair only, FileVersion and sha256 must match)
        shell: pwsh
        run: |
          $root = (Resolve-Path dist\OrbitRxMonitor).Path
          $pin = (Get-Content packaging\distribution_manifest.json -Raw | ConvertFrom-Json).ship_set.openssl
          $pyver = (python -c "import platform; print(platform.python_version())").Trim()
          if ($pyver -ne $pin.python) { throw "Build Python is $pyver, manifest pins $($pin.python)" }
          $expected = @($pin.dlls.PSObject.Properties.Name | ForEach-Object { $_.ToLower() } | Sort-Object)
          $found = @(Get-ChildItem -Path $root -Recurse -File | Where-Object { $_.Name -match '^(libcrypto|libssl|libeay|ssleay|openssl).*\.dll$' })
          $foundNames = @($found | ForEach-Object { $_.Name.ToLower() } | Sort-Object)
          Write-Host "OpenSSL DLLs in ship set: $($found | ForEach-Object { $_.FullName.Substring($root.Length + 1) })"
          if (($foundNames -join ',') -ne ($expected -join ',')) { throw "OpenSSL DLL set changed: expected $($expected -join ', '), found $($foundNames -join ', ')" }
          foreach ($prop in $pin.dlls.PSObject.Properties) {
            $dll = $found | Where-Object { $_.Name -ieq $prop.Name } | Select-Object -First 1
            if (-not $dll) { throw "$($prop.Name) missing from ship set" }
            if ($dll.DirectoryName -ne (Join-Path $root '_internal')) { throw "$($prop.Name) is not at _internal\$($prop.Name)" }
            $ver = "$($dll.VersionInfo.FileVersion)".Trim()
            $h = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Host "$($prop.Name) FileVersion=$ver sha256=$h"
            if ($ver -ne $prop.Value.file_version) { throw "$($prop.Name) FileVersion $ver != pinned $($prop.Value.file_version)" }
            if ($h -ne $prop.Value.sha256) { throw "$($prop.Name) sha256 $h != pinned $($prop.Value.sha256)" }
          }
          if (Get-ChildItem -Path $root -Recurse -File -Filter qopensslbackend.dll) { throw "qopensslbackend.dll reached the ship set" }
          Write-Host "OPENSSL-PIN: PASS"
      # P3: CPython's LICENSE.txt and Qt's third-party attributions ship in
      # the onedir with the manifest hashes, and the vendored CPython licence
      # is byte-identical to the build interpreter's own LICENSE.txt.
      - name: Shipped notices (CPython LICENSE, Qt third-party attributions)
        shell: pwsh
        run: |
          $root = (Resolve-Path dist\OrbitRxMonitor).Path
          $texts = (Get-Content packaging\distribution_manifest.json -Raw | ConvertFrom-Json).present_texts
          foreach ($rel in 'third_party/python/LICENSE.txt', 'third_party/qt/QT_THIRD_PARTY_ATTRIBUTIONS.txt', 'third_party/openssl/LICENSE.txt') {
            $shipped = Join-Path $root ('_internal/' + $rel)
            if (-not (Test-Path $shipped)) { throw "$rel is not in the onedir at _internal/$rel" }
            $h = (Get-FileHash $shipped -Algorithm SHA256).Hash.ToLower()
            Write-Host "_internal/$rel sha256=$h"
            if ($h -ne $texts.$rel) { throw "_internal/$rel sha256 $h != manifest $($texts.$rel)" }
          }
          $base = (python -c "import sys; print(sys.base_prefix)").Trim()
          $runnerLicence = Join-Path $base 'LICENSE.txt'
          if (-not (Test-Path $runnerLicence)) { throw "build interpreter has no LICENSE.txt at $runnerLicence" }
          $rh = (Get-FileHash $runnerLicence -Algorithm SHA256).Hash.ToLower()
          Write-Host "build interpreter LICENSE.txt sha256=$rh"
          if ($rh -ne $texts.'third_party/python/LICENSE.txt') { throw "vendored third_party/python/LICENSE.txt differs from the build interpreter's LICENSE.txt" }
          Write-Host "SHIPPED-NOTICES: PASS"
      # F1 ship-set gate: fails the build if a banned Qt binary (Pdf, Virtual
      # Keyboard, Quick/Qml, OpenGL, WebEngine/WebChannel, ...) reached the
      # onedir, or if a Qt library this build must keep is missing. Only a
      # text list of the Qt DLLs actually shipped is written out; no binary
      # is uploaded by this step.
      - name: Ship-set gate (no unused Qt binaries, required Qt libraries present)
        shell: pwsh
        run: |
          python tools/ship_set.py --check dist\OrbitRxMonitor --write-qt-list release-shots\ship-set-qt.txt --write-tls-list release-shots\ship-set-tls.txt
          if ($LASTEXITCODE -ne 0) { throw "ship-set gate failed: banned binary present, a required Qt library is missing, or the OpenSSL/TLS plugin set changed" }
          Write-Host "SHIP-SET-GATE: PASS"
          Get-Content release-shots\ship-set-qt.txt
          Get-Content release-shots\ship-set-tls.txt
      # Screenshots and the System32 launch write logs/ and data/ beside the
      # exe. Those runs use this copy. dist\OrbitRxMonitor stays unlaunched
      # and is what the installer and the zip ship.
      - name: Stage a launch copy
        shell: pwsh
        run: |
          python tools/check_pristine_payload.py dist\OrbitRxMonitor
          if ($LASTEXITCODE -ne 0) { throw "portable folder was already dirty before any launch" }
          if (Test-Path dist-smoke) { Remove-Item -Recurse -Force dist-smoke }
          New-Item -ItemType Directory -Force -Path dist-smoke | Out-Null
          Copy-Item -Recurse dist\OrbitRxMonitor dist-smoke\OrbitRxMonitor
          if (!(Test-Path dist-smoke\OrbitRxMonitor\OrbitRxMonitor.exe)) { throw "launch copy missing" }
          Write-Host "LAUNCH-COPY: dist-smoke (dist\OrbitRxMonitor left unlaunched)"
      # Distributable upload stays off while packaging/distribution_manifest.json
      # lists release_blockers. release.yml runs that gate and uploads nothing.
      # release-shots later in this job are screenshots and text, not the exe.
      - name: Self-capture the release exe at 100% and 150% scale (M3 evidence)
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist-smoke\OrbitRxMonitor\OrbitRxMonitor.exe).Path
          New-Item -ItemType Directory -Force -Path release-shots\100, release-shots\150 | Out-Null

          function Show-CaptureDiagnostics([string]$CaptureDir) {
            foreach ($name in 'shutdown-stage.txt', 'finalise-stage.txt', 'faulthandler.txt') {
              $f = Join-Path $CaptureDir $name
              if (Test-Path $f) {
                Write-Host "--- $name ($CaptureDir) ---"
                Get-Content $f
              } else {
                Write-Host "--- $name ($CaptureDir) missing ---"
              }
            }
          }

          function Invoke-ReleaseCapture([string]$CaptureDir, [string]$ScaleFactor) {
            Remove-Item Env:ORBITRX_TEST_SIMULATED_RIG -ErrorAction SilentlyContinue
            Remove-Item Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
            $env:ORBITRX_CAPTURE_DIR = (Resolve-Path $CaptureDir).Path
            $env:ORBITRX_COMMIT_SHA = $env:GITHUB_SHA.Substring(0,7)
            if ($ScaleFactor) { $env:QT_SCALE_FACTOR = $ScaleFactor }
            $proc = Start-Process -FilePath $exe -PassThru
            # Touch .Handle so Windows PowerShell actually populates .ExitCode once the
            # process exits (pwsh 7 does not need this, but it is harmless there too).
            $null = $proc.Handle
            if (-not $proc.WaitForExit(120000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Show-CaptureDiagnostics $CaptureDir
              throw "OrbitRxMonitor.exe did not exit within 120s for $CaptureDir"
            }
            if ($proc.ExitCode -ne 0) {
              Show-CaptureDiagnostics $CaptureDir
              throw "OrbitRxMonitor.exe exited $($proc.ExitCode) for $CaptureDir"
            }
            Get-ChildItem $CaptureDir | Format-Table Name, Length
            if (-not (Test-Path (Join-Path $CaptureDir 'rig-wizard-release-ports.txt'))) { throw "No capture written for $CaptureDir (exit $($proc.ExitCode))" }
          }

          Invoke-ReleaseCapture "release-shots\100" $null
          Invoke-ReleaseCapture "release-shots\150" "1.5"
          # Negative control: the same release exe WITH the test-only switch must list the
          # simulated rig, proving the gate below can actually see one.
          New-Item -ItemType Directory -Force -Path release-shots\negative-control | Out-Null
          $env:ORBITRX_TEST_SIMULATED_RIG = "1"
          $env:ORBITRX_CAPTURE_DIR = (Resolve-Path release-shots\negative-control).Path
          $proc = Start-Process -FilePath $exe -PassThru
          $null = $proc.Handle
          if (-not $proc.WaitForExit(120000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Show-CaptureDiagnostics "release-shots\negative-control"
            throw "negative control did not exit"
          }
          if ($proc.ExitCode -ne 0) {
            Show-CaptureDiagnostics "release-shots\negative-control"
            throw "negative control exited $($proc.ExitCode)"
          }
          Remove-Item Env:ORBITRX_TEST_SIMULATED_RIG -ErrorAction SilentlyContinue
          Remove-Item Env:ORBITRX_CAPTURE_DIR, Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
      - name: Fail if the simulated rig leaked into the release build
        shell: pwsh
        run: |
          foreach ($f in 'release-shots\100\rig-wizard-release-ports.txt', 'release-shots\150\rig-wizard-release-ports.txt', 'release-shots\negative-control\rig-wizard-release-ports.txt') {
            if (-not (Test-Path $f) -or ((Get-Content $f -Raw).Trim().Length -eq 0)) { throw "Port list $f is missing or empty" }
          }
          $neg = Get-Content release-shots\negative-control\rig-wizard-release-ports.txt -Raw
          Write-Host "Negative control (ORBITRX_TEST_SIMULATED_RIG=1) port list:"
          Write-Host $neg
          if ($neg -notmatch "Simulated") { throw "Negative control did not list the simulated rig, so the gate cannot be trusted" }
          Write-Host "NEGATIVE-CONTROL: PASS (gate detects 'Simulated' when the test switch is on)"
          $ports = Get-Content release-shots\100\rig-wizard-release-ports.txt, release-shots\150\rig-wizard-release-ports.txt -Raw
          Write-Host "Release exe port list (100% and 150%):"
          Write-Host $ports
          if ($ports -match "Simulated") {
            throw "Simulated rig port leaked into the release exe's port list"
          }
          Write-Host "SIMULATED-GATE: PASS (no 'Simulated' entry in the release exe port list)"
      # 5.2.0 L7 crash (15 Nov 2026): PermissionError on 'config.json' when the exe
      # was started from a folder it cannot write. Settings now live in %APPDATA%\OrbitRx.
      - name: Launch the release exe from an unwritable folder (C:\Windows\System32)
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist-smoke\OrbitRxMonitor\OrbitRxMonitor.exe).Path
          Remove-Item Env:ORBITRX_CAPTURE_DIR, Env:ORBITRX_TEST_SIMULATED_RIG, Env:QT_SCALE_FACTOR -ErrorAction SilentlyContinue
          $cfg = Join-Path $env:APPDATA 'OrbitRx\config.json'
          Remove-Item $cfg -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Join-Path $env:windir 'System32') -PassThru
          $null = $proc.Handle
          $exited = $proc.WaitForExit(15000)
          $proc.Refresh()
          $title = if ($exited) { '' } else { $proc.MainWindowTitle }
          if (-not $exited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Write-Host "exited=$exited exit=$(if ($exited) { $proc.ExitCode } else { 'n/a (still running, stopped)' }) title='$title' config=$(Test-Path $cfg)"
          if ($exited -and $proc.ExitCode -ne 0) { throw "OrbitRxMonitor.exe exited $($proc.ExitCode) when launched from System32" }
          if ($title -match 'Unhandled exception|Traceback|Error') { throw "OrbitRxMonitor.exe showed an error window when launched from System32: $title" }
          if (-not (Test-Path $cfg)) { throw "OrbitRxMonitor.exe did not write $cfg when launched from System32" }
          Write-Host "UNWRITABLE-CWD-LAUNCH: PASS (started from System32, settings written to %APPDATA%\OrbitRx)"
      - name: Check Settings and main window fit the screen at 150%
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Runner screen: $($b.Width)x$($b.Height)"
          foreach ($d in 'release-shots\100', 'release-shots\150') {
            $fit = Get-Content (Join-Path $d 'fit.txt') -Raw
            Write-Host "$d : $fit"
            if ($fit -notmatch 'save_visible=True') { throw "Save button not visible in $d" }
            if ($fit -notmatch 'settings_frame_on_screen=True' -or $fit -notmatch 'main_frame_on_screen=True') { throw "A window runs off the screen in $d" }
            if ($fit -notmatch 'main_hscroll=False') { throw "Main window shows a horizontal scrollbar in $d" }
            if ($fit -notmatch 'about_frame_on_screen=True' -or $fit -notmatch 'wizard_frame_on_screen=True') { throw "About or rig wizard runs off the screen in $d" }
          }
          Write-Host "FIT-GATE: PASS (Save visible; Settings, main window, About and rig wizard fully on screen; no main-window horizontal scrollbar)"
      - name: Publisher check (thevenom, never Obsidian Dynamics)
        shell: pwsh
        run: |
          foreach ($f in 'dist\OrbitRxMonitor\OrbitRxMonitor.exe', 'dist\OrbitRxMonitor-Setup.exe') {
            $v = (Get-Item $f).VersionInfo
            Write-Host "$f : CompanyName='$($v.CompanyName)' LegalCopyright='$($v.LegalCopyright)'"
            if ("$($v.CompanyName) $($v.LegalCopyright)" -match 'Obsidian') { throw "Obsidian Dynamics found in $f version info" }
            if ("$($v.CompanyName)".Trim() -ne 'thevenom') { throw "Unexpected CompanyName in $f" }
          }
          Write-Host "PUBLISHER-CHECK: PASS"
      - name: PE check (security directory 0/0, publisher strings)
        shell: pwsh
        run: |
          python tools/pe_check.py release-shots\installer-publisher.txt dist\OrbitRxMonitor\OrbitRxMonitor.exe dist\OrbitRxMonitor-Setup.exe
      - name: Units check (no "n/a <unit>" in rendered Stats text)
        shell: pwsh
        run: |
          foreach ($d in 'release-shots\100', 'release-shots\150') {
            $t = Get-Content (Join-Path $d 'stats.txt') -Raw
            if ([string]::IsNullOrWhiteSpace($t)) { throw "stats.txt is empty in $d" }
            if ($t -match 'n/a\s+(MHz|UTC|km/h|nT|km|deg)') { throw "Found 'n/a' followed by a unit in $d stats text" }
          }
          Write-Host "UNITS-CHECK: PASS (no 'n/a' followed by a unit)"
      - name: Scan the bundled PYZ for the simulated-rig gate
        shell: pwsh
        run: |
          python tools/scan_pyz.py dist\OrbitRxMonitor\OrbitRxMonitor.exe release-shots\pyz-scan.txt
      - name: Measure DX cluster field edges
        shell: pwsh
        run: |
          python tools/measure_field_edges.py release-shots\100\settings-dx-cluster.png release-shots\100\settings-dx-cluster-edges.txt
          python tools/measure_field_edges.py release-shots\150\settings-dx-cluster.png release-shots\150\settings-dx-cluster-edges.txt
          foreach ($f in 'release-shots\100\settings-dx-cluster-edges.txt', 'release-shots\150\settings-dx-cluster-edges.txt') {
            if (-not (Test-Path $f) -or ((Get-Content $f -Raw).Trim().Length -eq 0)) { throw "Edges file $f is empty" }
            Write-Host "$f :"; Get-Content $f
          }
      - name: Check the installer payload is pristine
        shell: pwsh
        run: |
          $dest = Join-Path $env:TEMP "orbitrx-pristine-install"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          $log = "release-shots\install-pristine.log"
          $setup = (Resolve-Path dist\OrbitRxMonitor-Setup.exe).Path
          $proc = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dest","/LOG=$log" -Wait -PassThru
          Write-Host "installer exit=$($proc.ExitCode) dest=$dest"
          if ($proc.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw "installer exited $($proc.ExitCode)"
          }
          if (!(Test-Path (Join-Path $dest "OrbitRxMonitor.exe"))) { throw "installer did not extract OrbitRxMonitor.exe" }
          python tools/check_pristine_payload.py $dest
          if ($LASTEXITCODE -ne 0) { throw "installer payload is not pristine" }
          Write-Host "INSTALLER-PRISTINE: PASS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-exe-captures
          path: release-shots/
          retention-days: 30
          if-no-files-found: warn
      # Release QA artifact. Not a GitHub Release and not the public 5.1.0 download.
      - name: Pack OrbitRx-5.2.0-win-x64.zip
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if ($ver -ne "5.2.0") { throw "VERSION is $ver, this pack step is for 5.2.0" }
          python tools/check_pristine_payload.py dist\OrbitRxMonitor
          if ($LASTEXITCODE -ne 0) { throw "refusing to pack a launched portable folder" }
          # Same roots as the live 5.1.0 zip: the portable onedir (exe, NOTICE,
          # third-party licence texts) plus the installer, then SHA256SUMS.txt.
          $name = "OrbitRx-$ver-win-x64.zip"
          if (Test-Path $name) { Remove-Item $name -Force }
          tar -a -c -f $name -C dist OrbitRxMonitor OrbitRxMonitor-Setup.exe SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw "tar failed" }
          python tools/check_pristine_payload.py --zip $name
          if ($LASTEXITCODE -ne 0) { throw "release zip is not pristine" }
          $zip = Get-Item $name
          $zipHash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host ("ARTIFACT {0}  {1} bytes  sha256={2}" -f $zip.Name, $zip.Length, $zipHash)
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $name))
          $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
          Write-Host ("ZIP members {0}" -f $names.Count)
          foreach ($required in @(
            "OrbitRxMonitor/OrbitRxMonitor.exe",
            "OrbitRxMonitor-Setup.exe",
            "OrbitRxMonitor/_internal/NOTICE",
            "SHA256SUMS.txt"
          )) {
            if ($names -notcontains $required) { throw "zip missing $required" }
          }
          if (-not ($names | Where-Object { $_.StartsWith("OrbitRxMonitor/_internal/third_party/") })) {
            throw "zip is missing third-party licence texts"
          }
          if ($names | Where-Object { $_.EndsWith("Qt6WebEngineCore.dll") }) {
            throw "Qt WebEngine reached the release zip"
          }
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          foreach ($entry in $archive.Entries) {
            $rel = $entry.FullName.Replace('\','/')
            if ($rel -in @(
              "OrbitRxMonitor/OrbitRxMonitor.exe",
              "OrbitRxMonitor-Setup.exe",
              "OrbitRxMonitor/_internal/NOTICE",
              "SHA256SUMS.txt"
            )) {
              $stream = $entry.Open()
              $hashBytes = $sha256.ComputeHash($stream)
              $stream.Close()
              $sha = [System.BitConverter]::ToString($hashBytes).Replace("-","").ToLower()
              Write-Host ("ARTIFACT {0}  {1} bytes  sha256={2}" -f $rel, $entry.Length, $sha)
            }
          }
          $archive.Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitRx-5.2.0-win-x64
          path: OrbitRx-5.2.0-win-x64.zip
          retention-days: 14
          if-no-files-found: error
