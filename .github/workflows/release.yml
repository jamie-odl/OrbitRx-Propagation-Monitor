name: Release

# Manual-only. Publishing is not enabled. The gate refuses while Qt
# distribution materials are still unresolved, and this workflow never uploads.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_distribution_manifest.py --release
