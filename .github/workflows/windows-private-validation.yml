name: Private Windows validation

# Scoped to this review branch. Builds the onedir for this commit, uploads a
# one-day transfer zip (not a GitHub Release and not the published 5.1.0 zip),
# then deletes dist on the runner.
on:
  push:
    branches:
      - cursor/shipped-5-1-0-notices-2d8d

permissions:
  contents: read

concurrency:
  group: windows-private-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-onedir:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Record the commit under test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path validation-logs | Out-Null
          git rev-parse HEAD | Set-Content validation-logs\HEAD.txt
          python -c "import sys; print(sys.version)" | Set-Content validation-logs\python.txt
      - name: Pytest
        shell: pwsh
        run: python -m pytest -q -rA --junitxml=validation-logs\pytest-windows.xml
      - name: Build onedir
        run: pyinstaller OrbitRxMonitor.spec --noconfirm
      - name: Build installer locally and do not upload it
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVer=$ver" installer\OrbitRxMonitor.iss
          if (!(Test-Path dist\OrbitRxMonitor-Setup.exe)) { throw "installer missing" }
      - name: Layout, notices, privacy, and PYZ scan
        shell: pwsh
        run: |
          python tools/check_onedir_layout.py dist\OrbitRxMonitor
          if ($LASTEXITCODE -ne 0) { throw "onedir layout check failed" }
          python -c "from orbitrx.config import DEFAULT_CONFIG as c; assert c['ip_geolocation_enabled'] is False; assert c['home_lat']==51.5081; assert c['home_lon']==-0.1281; assert c['map_backend']=='static'; assert c['qrz_api_key']==''"
          if ($LASTEXITCODE -ne 0) { throw "privacy defaults failed" }
          python tools/scan_pyz.py dist\OrbitRxMonitor validation-logs\pyz-scan.txt
          if ($LASTEXITCODE -ne 0) { throw "PYZ scan failed" }
          Get-ChildItem dist\OrbitRxMonitor -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path dist\OrbitRxMonitor).Path.Length+1) } | Sort-Object | Set-Content validation-logs\onedir-names.txt
          Select-String -Path validation-logs\onedir-names.txt -Pattern "Qt6(Core|WebEngineCore)\.dll" | ForEach-Object { $_.Line } | Set-Content validation-logs\qt-dlls.txt
          "{0}  OrbitRxMonitor-Setup.exe" -f (Get-FileHash dist\OrbitRxMonitor-Setup.exe -Algorithm SHA256).Hash.ToLower() | Set-Content validation-logs\installer-sha256.txt
          "{0}  OrbitRxMonitor.exe" -f (Get-FileHash dist\OrbitRxMonitor\OrbitRxMonitor.exe -Algorithm SHA256).Hash.ToLower() | Set-Content validation-logs\exe-sha256.txt
      - name: Smoke the static map
        shell: pwsh
        run: |
          $env:ORBITRX_CAPTURE_DIR = (Resolve-Path .).Path + "\capture-static"
          New-Item -ItemType Directory -Force -Path $env:ORBITRX_CAPTURE_DIR | Out-Null
          $exe = (Resolve-Path dist\OrbitRxMonitor\OrbitRxMonitor.exe).Path
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardOutput validation-logs\static-stdout.txt -RedirectStandardError validation-logs\static-stderr.txt
          if (-not $proc.WaitForExit(120000)) { Stop-Process -Id $proc.Id -Force; throw "static smoke hung" }
          "$($proc.ExitCode)" | Set-Content validation-logs\static-exit.txt
          foreach ($n in @("main-window.png","about.png","fit.txt","shutdown-stage.txt")) {
            if (-not (Test-Path (Join-Path $env:ORBITRX_CAPTURE_DIR $n))) { throw "static capture missing $n" }
          }
          if ($proc.ExitCode -ne 0) { throw "static smoke exit $($proc.ExitCode)" }
      - name: Smoke the interactive map
        shell: pwsh
        run: |
          $dir = (Resolve-Path dist\OrbitRxMonitor).Path
          '{"map_backend":"leaflet","ip_geolocation_enabled":false,"home_lat":51.5081,"home_lon":-0.1281,"qrz_api_key":""}' | Set-Content (Join-Path $dir config.json) -Encoding ascii
          $env:ORBITRX_CAPTURE_DIR = (Resolve-Path .).Path + "\capture-leaflet"
          New-Item -ItemType Directory -Force -Path $env:ORBITRX_CAPTURE_DIR | Out-Null
          $exe = Join-Path $dir OrbitRxMonitor.exe
          $proc = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru -RedirectStandardOutput validation-logs\leaflet-stdout.txt -RedirectStandardError validation-logs\leaflet-stderr.txt
          if (-not $proc.WaitForExit(120000)) { Stop-Process -Id $proc.Id -Force; throw "leaflet smoke hung" }
          "$($proc.ExitCode)" | Set-Content validation-logs\leaflet-exit.txt
          foreach ($n in @("main-window.png","shutdown-stage.txt")) {
            if (-not (Test-Path (Join-Path $env:ORBITRX_CAPTURE_DIR $n))) { throw "leaflet capture missing $n" }
          }
          if ($proc.ExitCode -ne 0) { throw "leaflet smoke exit $($proc.ExitCode)" }
      - name: Record candidate hashes without uploading the binaries
        if: success()
        shell: pwsh
        run: |
          "{0}  OrbitRxMonitor-Setup.exe" -f (Get-FileHash dist\OrbitRxMonitor-Setup.exe -Algorithm SHA256).Hash.ToLower() | Set-Content validation-logs\installer-sha256.txt
          "{0}  OrbitRxMonitor.exe" -f (Get-FileHash dist\OrbitRxMonitor\OrbitRxMonitor.exe -Algorithm SHA256).Hash.ToLower() | Set-Content validation-logs\exe-sha256.txt
      - name: Upload logs and screenshots only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-private-validation-logs
          path: |
            validation-logs/**
            capture-static/**
            capture-leaflet/**
          retention-days: 14
          if-no-files-found: warn
      - name: Pack a private candidate zip
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path candidate | Out-Null
          tar -a -c -f candidate\OrbitRx-windows-onedir-private.zip -C dist OrbitRxMonitor OrbitRxMonitor-Setup.exe
          "{0}  OrbitRx-windows-onedir-private.zip" -f (Get-FileHash candidate\OrbitRx-windows-onedir-private.zip -Algorithm SHA256).Hash.ToLower() | Set-Content candidate\zip-sha256.txt
          Copy-Item validation-logs\HEAD.txt,validation-logs\exe-sha256.txt,validation-logs\installer-sha256.txt candidate\
      - name: Upload the private candidate for agent-store transfer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-private-candidate
          path: candidate/**
          retention-days: 1
          if-no-files-found: error
      - name: Delete local distributables before the job ends
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
          if (Test-Path dist) { throw "dist was not removed" }
